  <rect x="64" y="96" width="112" height="112" rx="26" fill="url(#accent)" opacity="0.95"/>
  <g stroke="#04211a" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 132 L88 152 L108 172"/>
    <path d="M132 132 L152 152 L132 172"/>
    <path d="M126 128 L114 176"/>
  </g>

  <text x="212" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#f8fafc">CodeReview Buddy</text>
  <text x="212" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">AI-assisted code review for GitHub pull requests</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#a7f3d0">
    <rect x="212" y="216" width="104" height="32" rx="16" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3"/>
